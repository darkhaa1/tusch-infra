# /etc/ansible/inventory.ini — inventaire en service
# IP privées 10.10.0.x (RFC 1918) conservées pour la lisibilité.

[monitored]
authentik ansible_host=10.10.0.50
ansible    ansible_host=10.10.0.60
app        ansible_host=10.10.0.30

[monitored:vars]
ansible_user=root
ansible_ssh_private_key_file=/root/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3
